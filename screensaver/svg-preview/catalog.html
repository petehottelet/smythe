<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smythe — Original SVG Catalog</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body class="catalog"><div class="catalog-heading"><div><h1>192 original glyphs</h1><p id="catalog-status">Loading the catalog…</p><nav aria-label="Test sheets"><a href="../glyph-design-v2/contact-sheet-128.png">Full sheet</a> · <a href="../glyph-design-v2/contact-sheet-16.png">16 px</a> · <a href="../glyph-design-v2/contact-sheet-32.png">32 px</a> · <a href="../glyph-design-v2/contact-sheet-64.png">64 px</a></nav></div><a href="index.html?originalMix=100">Explore these glyphs</a></div>
<main id="catalog" aria-label="All current original glyphs"></main><script src="glyphs.js"></script><script type="module">
const status = document.getElementById('catalog-status');
function render(){
const catalog=globalThis.SVG_GLYPHS;
document.getElementById('catalog').replaceChildren();
if (!catalog?.glyphs?.length) status.textContent='The generated catalog is not available yet.';
else {
  status.textContent=`${catalog.glyphs.length} revised silhouettes. Select an ID to open its SVG.`;
  for (const glyph of catalog.glyphs) {
    const figure=document.createElement('figure'); figure.className='specimen';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('role','img'); svg.setAttribute('aria-label',glyph.glyph_id);
    for (const d of glyph.paths ?? [glyph.path]) { const path=document.createElementNS(svg.namespaceURI,'path'); path.setAttribute('d',d); path.setAttribute('fill-rule','nonzero'); svg.append(path); }
    const caption=document.createElement('figcaption'), link=document.createElement('a');
    link.href=`../glyph-design-v2/${encodeURIComponent(glyph.glyph_id)}.svg`;link.textContent=glyph.glyph_id;
    caption.append(link);figure.append(svg,caption);document.getElementById('catalog').append(figure);
  }
}
}
render();
</script></body></html>
