[workspace]
members = ["crates/smythe-core", "crates/smythe", "crates/smythe-cli", "crates/smythe-noumenon", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/petehottelet/smythe"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
geo = { version = "0.31", default-features = false }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tiny-skia = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde_jcs = "0.1"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

