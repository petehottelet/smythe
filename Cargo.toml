[workspace]
members = ["crates/smythe-core", "crates/smythe-noumenon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/petehottelet/smythe"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
geo = { version = "0.31", default-features = false }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny-skia = "0.11"
fs2 = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

