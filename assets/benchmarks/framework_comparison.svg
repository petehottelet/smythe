<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-label="Framework benchmark comparing Smythe, LangGraph, and CrewAI. Smythe has the highest observed blind score, fewest tokens, and lowest mean wall time.">
