<text x="758" y="187" font-family="'Trajan Pro 3','Trajan Pro',Trajan,Cinzel,Georgia,serif" font-size="31" fill="#ffffff" text-anchor="start" font-weight="700">04</text>
<text x="758" y="216" font-family="'Avenir Next',Avenir,'Helvetica Neue',Helvetica,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="700" letter-spacing="1.5">ASSEMBLE</text>
<text x="758" y="237" font-family="'Avenir Next',Avenir,'Helvetica Neue',Helvetica,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">Atlas + web + ports</text>
<line x1="40" y1="282" x2="920" y2="282" stroke="#000000"/>
<text x="40" y="306" font-family="'Avenir Next',Avenir,'Helvetica Neue',Helvetica,sans-serif" font-size="11" fill="#000000" text-anchor="start" font-weight="700" letter-spacing="1.1">Generated execution topology</text>
<text x="920" y="306" font-family="'Avenir Next',Avenir,'Helvetica Neue',Helvetica,sans-serif" font-size="11" fill="#000000" text-anchor="end" font-weight="normal">Bounded concurrency / objective gates / traces / per-node recovery</text>
