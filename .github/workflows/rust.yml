name: Rust alpha

on:
  push:
    branches: [main, 'feature/rust-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.91.0 fetch --locked
      - run: cargo +1.91.0 fmt --all -- --check
      - run: cargo +1.91.0 clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo +1.91.0 test --workspace --locked --offline
      - run: cargo +1.91.0 build --release --locked --offline
      - name: Bound native compilation overhead
        run: cargo +1.91.0 test --release --locked --offline -p smythe-noumenon release_compile_256_has_bounded_journal_cost -- --ignored --nocapture
      - name: Bound scheduler and inline storage scaling
        run: cargo +1.91.0 test --release --locked --offline -p smythe --test scaling -- --ignored --nocapture
      - name: Validate all native glyphs
        run: cargo run --release --locked --offline --bin smythe -- noumenon --glyphs 256 --workers 8 --out smythe_artifacts/rust-smoke
      - name: Verify completed recovery
        run: cargo run --release --locked --offline --bin smythe -- noumenon --glyphs 256 --workers 8 --out smythe_artifacts/rust-smoke --resume
      - name: Record committed source provenance
        run: cargo run --release --locked --offline -p xtask -- provenance
