name: Rust preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.91.0 fetch --locked
      - run: cargo +1.91.0 fmt --all -- --check
      - run: cargo +1.91.0 clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo +1.91.0 test --workspace --locked --offline
      - run: cargo +1.91.0 build --release --locked --offline
      - run: pip install -e ".[dev]"
      - name: Check fresh Python parity and original validation gates
        run: python benchmarks/run_rust_noumenon.py --smoke --out smythe_artifacts/rust-smoke
