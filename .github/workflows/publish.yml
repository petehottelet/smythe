name: Publish to PyPI

# Trusted publishing: PyPI's pending publisher is configured to trust
# exactly this workflow filename (publish.yml) and the `pypi` GitHub
# environment. No API token — GitHub OIDC via id-token: write.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Record exact distribution hashes
        run: sha256sum dist/*.whl dist/*.tar.gz > package-hashes.txt

      - name: Retain the distributions before publishing
        uses: actions/upload-artifact@v6
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            package-hashes.txt
          if-no-files-found: error

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
