name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  large-file-review:
    # A deliberately rewritten history has no guaranteed fetchable before-SHA.
    # Such cleanup requires its own complete history audit before publication.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !github.event.forced && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Review newly introduced large binary evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/large_files.py --base "$BASE_SHA"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned: an unpinned linter makes CI non-reproducible.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: pip install mypy==1.17.1
      - run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --cov=smythe --cov-report=term --cov-report=xml

      - name: Upload coverage report (artifact)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install offline benchmark dependencies
        run: pip install -e ".[dev]" "pillow>=10.0"
      - name: Exercise image concurrency harness offline
        run: >-
          python benchmarks/run_image_benchmarks.py
          --k 1,3 --images 4 --repeats 1
          --out "$RUNNER_TEMP/image.json"
          --artifact-dir "$RUNNER_TEMP/image-artifacts"
      - name: Exercise asset suite offline
        run: >-
          python benchmarks/run_asset_suite.py
          --out "$RUNNER_TEMP/asset-artifacts"
          --results "$RUNNER_TEMP/asset.json"
      - name: Exercise glyph fan-out offline
        run: >-
          python benchmarks/run_glyph_screensaver.py
          --glyphs 4
          --concurrencies 1,2
          --latency-s 0
          --out "$RUNNER_TEMP/glyph-artifacts"
          --results "$RUNNER_TEMP/glyph.json"
      - name: Exercise original SVG generation and validation offline
        run: >-
          python benchmarks/run_svg_glyph_benchmark.py
          --glyphs 4 --concurrencies 1,2 --executors process
          --repeats 1 --render-sizes 64
          --out "$RUNNER_TEMP/svg-glyph-artifacts"
          --results "$RUNNER_TEMP/svg-glyph.json"
      - name: Verify the persistent 3D world and camera
        run: node screensaver/svg-preview/verify-model.mjs
      - name: Verify all native catalog exports match the canonical SVGs
        run: python screensaver/export_native_glyphs.py --check
      - name: Verify reference presets and settings
        run: |
          node screensaver/svg-preview/verify-settings.mjs
          node screensaver/svg-preview/verify-config.mjs
          node screensaver/svg-preview/verify-timing.mjs
          node screensaver/svg-preview/verify-lifecycle.mjs
      - name: Verify browser receipt provenance checks
        run: node screensaver/svg-preview/verify-provenance.mjs
      - name: Verify browser helper process handling
        run: node screensaver/svg-preview/verify-browser-command.mjs
      - name: Verify benchmark receipt overwrite protection
        run: node screensaver/svg-preview/verify-measure-guard.mjs
      - name: Verify renderer measurements and browser identity
        run: |
          node screensaver/svg-preview/verify-measurement.mjs
          node screensaver/svg-preview/verify-browser-metadata.mjs
          node screensaver/svg-preview/verify-raf-control.mjs

  openai-responses-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the tested native Responses SDK baseline
        run: pip install -e ".[dev,openai]" "openai==3.8.0"
      - name: Verify native wire, pricing, and failure accounting without network calls
        run: >-
          python -m pytest -q
          tests/test_provider_responses.py
          tests/test_native_pricing.py
          tests/test_native_response_accounting.py
          tests/test_workflow_provider.py
          tests/test_workflow_native_runtime.py
          tests/test_astra_runtime.py

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build hatchling pytest
          python -m pytest -q tests/test_pypi_readme.py
          python -m build
          python tools/distribution.py --dist dist
      - name: Verify isolated source rebuild, package tests, and consumer types
        run: python tools/package_smoke.py --dist dist --work "$RUNNER_TEMP/source-package-check"
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smythe-wheel"
          "$RUNNER_TEMP/smythe-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smythe-wheel/bin/python" -m pip install dist/*.whl pillow
      - name: Smoke-test installed public surfaces
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smythe-wheel/bin/python" -c "import smythe, smythe.assets, smythe.jobs, smythe.optimize"
          "$RUNNER_TEMP/smythe-wheel/bin/smythe" --help
          "$RUNNER_TEMP/smythe-wheel/bin/smythe" jobs schema --json
      - name: Export a saved Autotune campaign from the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smythe-wheel/bin/smythe" optimize concurrency --campaign-id package-report --ledger report.sqlite3 --json > campaign.json
          "$RUNNER_TEMP/smythe-wheel/bin/smythe" optimize inspect package-report --ledger report.sqlite3 --json > before.json
          "$RUNNER_TEMP/smythe-wheel/bin/python" -c "from pathlib import Path; import hashlib; Path('database.sha256').write_text(hashlib.sha256(Path('report.sqlite3').read_bytes()).hexdigest())"
          "$RUNNER_TEMP/smythe-wheel/bin/smythe" optimize inspect package-report --ledger report.sqlite3 --json --out report.html > after.json
          "$RUNNER_TEMP/smythe-wheel/bin/python" -c "from pathlib import Path; import hashlib,json; assert json.loads(Path('before.json').read_text()) == json.loads(Path('after.json').read_text()); assert hashlib.sha256(Path('report.sqlite3').read_bytes()).hexdigest() == Path('database.sha256').read_text(); page = Path('report.html').read_text(); assert '<html' in page and 'Content-Security-Policy' in page and 'package-report' in page; print('Installed report: unchanged inspection JSON and database bytes')"

  skill-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build the skill from the tested commit
        run: python tools/skill_archive.py --out "$RUNNER_TEMP/skill-dist"
      - name: Verify against the exact released runtime
        run: |
          python -m venv "$RUNNER_TEMP/skill-runtime"
          "$RUNNER_TEMP/skill-runtime/bin/python" -m pip install -r skills/repo-doctor/runtime.txt
          python tools/skill_archive.py --verify "$RUNNER_TEMP/skill-dist/"*.zip --python "$RUNNER_TEMP/skill-runtime/bin/python"

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Exercise the suite on Windows
        run: python -m pytest tests/ -q

  macos-operator-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install operator test dependencies
        run: python -m pip install -e ".[dev,jobs]"
      - name: Verify operator, journals, planner history, and reports
        run: >-
          python -m pytest -q
          tests/test_jobs_operator.py
          tests/test_jobs_operator_cli.py
          tests/test_jobs_pause.py
          tests/test_jobs_artifact_namespace.py
          tests/test_checkpoint_atomic.py
          tests/test_checkpoint.py
          tests/test_sqlite_initialization.py
          tests/test_jobs_workflow_initialization.py
          tests/test_optimize_lease.py
          tests/test_memory.py
          tests/test_optimize_inspection.py
          tests/test_optimize_report_cli.py
          tests/test_optimize_report.py
